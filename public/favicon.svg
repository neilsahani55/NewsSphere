<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Navy sphere — the "Sphere" half of the brand -->
  <circle cx="16" cy="16" r="15" fill="#1a3c6e"/>

  <!-- Subtle equator suggesting a globe / wire-frame -->
  <ellipse cx="16" cy="16" rx="15" ry="5.5" fill="none" stroke="#5d7ba8" stroke-width="0.9" opacity="0.9"/>

  <!-- Stylized serif "N" — the "News" half -->
  <path d="M10.5 22 V10.5 L21.5 22 V10.5"
        stroke="#f5f4f0" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Gold accent dot — same gold (#d4a847) used in the header brand dot -->
  <circle cx="25.5" cy="7" r="2.6" fill="#d4a847"/>
</svg>
