<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#1a3c6e" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a3c6e" />

    <!-- Primary meta -->
    <title>NewsSphere — News Intelligence</title>
    <meta name="description" content="NewsSphere aggregates top news from 27 curated sources, enriches every article with AI-written analysis, and lets you read in 18 languages." />
    <meta name="keywords" content="news, India, world news, AI news, multilingual news, news aggregator, breaking news" />
    <meta name="author" content="NewsSphere" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="NewsSphere" />
    <meta property="og:title"       content="NewsSphere — News Intelligence" />
    <meta property="og:description" content="AI-enriched news from 27 global sources. Read in 18 languages. Free, fast, no ads." />
    <meta property="og:image"       content="/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="NewsSphere — News Intelligence" />
    <meta name="twitter:description" content="AI-enriched news from 27 global sources. Read in 18 languages. Free, fast, no ads." />
    <meta name="twitter:image"       content="/og-image.png" />

    <!-- JSON-LD: WebSite schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NewsSphere",
      "description": "AI-enriched multilingual news aggregator covering India, World, Tech, Business, Science, Health, Sports, Entertainment, Crypto, Politics, Environment and Crime.",
      "publisher": {
        "@type": "Organization",
        "name": "NewsSphere"
      }
    }
    </script>

    <!-- Google Identity Services — popup-based login (no Supabase redirect) -->
    <script src="https://accounts.google.com/gsi/client" async></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
