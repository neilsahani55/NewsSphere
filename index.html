<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#1a3c6e" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a3c6e" />

    <!-- Primary meta -->
    <title>NewsSphere — News Intelligence</title>
    <meta name="description" content="NewsSphere aggregates top news from 50+ curated sources, enriches every article with AI-written analysis, and lets you read in 18 languages." />
    <meta name="keywords" content="news, India, world news, AI news, multilingual news, news aggregator, breaking news, today news" />
    <meta name="author" content="NewsSphere" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://newssphere.tech/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="NewsSphere" />
    <meta property="og:url"         content="https://newssphere.tech/" />
    <meta property="og:title"       content="NewsSphere — News Intelligence" />
    <meta property="og:description" content="AI-enriched news from 50+ global sources. Read in 18 languages. Free, fast, no ads." />

    <!-- Twitter / X card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:site"        content="@newssphere" />
    <meta name="twitter:title"       content="NewsSphere — News Intelligence" />
    <meta name="twitter:description" content="AI-enriched news from 50+ global sources. Read in 18 languages. Free, fast, no ads." />

    <!-- JSON-LD: WebSite schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NewsSphere",
      "url": "https://newssphere.tech",
      "description": "AI-enriched multilingual news aggregator covering India, World, Tech, Business, Science, Health, Sports, Entertainment, Crypto, Politics, Environment and Crime.",
      "publisher": {
        "@type": "Organization",
        "name": "NewsSphere",
        "url": "https://newssphere.tech"
      }
    }
    </script>

    <!-- Google Identity Services — popup-based login (no Supabase redirect) -->
    <script src="https://accounts.google.com/gsi/client" async></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts asynchronously — avoids a render-blocking network round-trip.
         The browser paints with system fonts first, then swaps in web fonts. -->
    <link
      rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
