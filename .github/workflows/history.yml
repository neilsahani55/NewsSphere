name: NewsSphere — Today in History

on:
  schedule:
    # Primary: 17:30 UTC = 23:00 IST — pre-populate 1 hr before midnight
    - cron: '30 17 * * *'
    # Backup:  19:00 UTC = 00:30 IST — catches missed/delayed primary runs
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  run-history:
    name: Fetch → Store Today in History
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: history-pipeline/package.json

      - name: Install dependencies
        run: npm install
        working-directory: history-pipeline

      - name: Run history pipeline
        run: node index.js
        working-directory: history-pipeline
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
