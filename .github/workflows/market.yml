name: NewsSphere — Market Data

on:
  schedule:
    # Every 15 minutes during Indian market hours (3:45–10:30 UTC = 9:15–16:00 IST)
    - cron: '*/15 3-10 * * 1-5'
    # Hourly outside market hours and weekends (keeps data fresh for display)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-market:
    name: Fetch → Store Market Data
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: history-pipeline/package.json

      - name: Install dependencies
        run: npm install
        working-directory: history-pipeline

      - name: Fetch and store market data
        run: node market.js
        working-directory: history-pipeline
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
