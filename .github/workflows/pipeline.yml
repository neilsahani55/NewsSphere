name: NewsSphere Pipeline — Group 1 (India · World · Tech · Business)

on:
  schedule:
    # Runs at :00 and :30 every hour
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    name: Fetch → Enrich → Store [Group 1]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # If the last commit is older than 50 days, push an empty commit to reset the timer.
      - name: Keepalive commit
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Last commit was $days day(s) ago"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive commit to prevent scheduled workflow auto-disable"
            git push
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pipeline/package.json

      - name: Install pipeline dependencies
        run: npm install
        working-directory: pipeline

      - name: Run pipeline
        run: node index.js
        working-directory: pipeline
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NVIDIA_KEY:           ${{ secrets.NVIDIA_KEY }}
          GEMINI_KEY:           ${{ secrets.GEMINI_KEY }}
          OPENAI_KEY:           ${{ secrets.OPENAI_KEY }}
          PIPELINE_GROUP:       '1'
